services:
  validator:
    build: .
    container_name: llm-validator
    ports:
      - "8900:8900"
    volumes:
      - uploads:/app/data/uploads
      - userdata:/app/validator/data
    environment:
      - TZ=Asia/Shanghai
      - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped
    healthcheck:
      test: python3 /app/healthcheck.py
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  uploads:
  userdata:

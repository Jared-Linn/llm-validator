<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM 标注验证系统 v3</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;--text:#e6edf3;--text-muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--yellow:#d29922;--red:#f85149;--purple:#bc8cff;--cyan:#39d2c0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.container{max-width:1400px;margin:0 auto;padding:16px 24px}

/* Header */
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap;gap:8px}
.header h1{font-size:20px;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer}
.header .sub{color:var(--text-muted);font-size:11px;margin-top:1px}
.header .sub span{background:var(--surface2);padding:1px 6px;border-radius:3px;color:var(--accent);-webkit-text-fill-color:var(--accent);font-size:10px}
.header-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);transition:all .12s;text-decoration:none;background:var(--surface2);color:var(--text)}
.btn:hover{filter:brightness(1.2)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-red{background:var(--red);color:#fff;border-color:var(--red)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-muted)}
.btn-ghost:hover{color:var(--text);background:var(--surface2)}

/* Auth Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:400px;max-width:90vw;max-height:90vh;overflow-y:auto}
.modal h2{font-size:18px;margin-bottom:20px;text-align:center}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--accent)}
.form-group .hint{font-size:11px;color:var(--text-muted);margin-top:3px}
.form-group .hint a{color:var(--accent)}
.form-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.form-error{color:var(--red);font-size:12px;margin-top:4px;display:none}
.toggle-auth{text-align:center;margin-top:12px;font-size:12px;color:var(--text-muted)}
.toggle-auth a{color:var(--accent);cursor:pointer}

/* Settings Panel */
.settings-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.settings-panel h3{font-size:13px;color:var(--text-muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.settings-panel h3 small{font-weight:400;text-transform:none;color:var(--text-muted);font-size:11px}
.provider-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;transition:border-color .15s}
.provider-card:hover{border-color:var(--text-muted)}
.provider-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.provider-card .head .name{font-weight:600;font-size:14px}
.provider-card .head .status{font-size:11px;padding:2px 8px;border-radius:6px}
.provider-card .head .status.configured{background:rgba(63,185,80,.12);color:var(--green)}
.provider-card .head .status.missing{background:rgba(210,153,34,.12);color:var(--yellow)}
.provider-card .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.provider-card .fields .full{grid-column:1/-1}
.provider-card .fields input{width:100%;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none}
.provider-card .fields input:focus{border-color:var(--accent)}
.provider-card .fields input:disabled{opacity:.5}

/* Upload Zone */
.upload-zone{border:2px dashed var(--border);border-radius:14px;padding:40px 30px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:16px;background:var(--surface)}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:rgba(88,166,255,.05)}
.upload-zone .icon{font-size:36px;margin-bottom:10px}
.upload-zone .title{font-size:16px;font-weight:600;margin-bottom:6px}
.upload-zone .hint{color:var(--text-muted);font-size:12px}
.upload-zone .hint code{background:var(--surface2);padding:1px 5px;border-radius:3px;font-size:11px}
.upload-zone input{display:none}

/* Stats & Charts (same as before) */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.stat-card:hover{border-color:var(--accent)}
.stat-card .label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.stat-card .value{font-size:24px;font-weight:700}
.stat-card .value.green{color:var(--green)}.stat-card .value.blue{color:var(--accent)}.stat-card .value.purple{color:var(--purple)}.stat-card .value.cyan{color:var(--cyan)}.stat-card .value.yellow{color:var(--yellow)}
.stat-card .sub{font-size:11px;color:var(--text-muted);margin-top:3px}
.charts-row{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:16px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.chart-card h3{font-size:12px;color:var(--text-muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.chart-card .chart-container{position:relative;height:220px}
.llm-section{margin-bottom:16px}.llm-section h3{font-size:12px;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase}
.llm-row{display:flex;align-items:center;margin-bottom:5px}
.llm-row .llm-name{width:140px;font-size:12px;font-weight:600;flex-shrink:0}
.llm-row .bar-track{flex:1;height:22px;background:var(--surface2);border-radius:11px;overflow:hidden}
.llm-row .bar-fill{height:100%;border-radius:11px;transition:width .8s;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:10px;font-weight:600;min-width:30px}
.llm-row .bar-fill.deepseek{background:linear-gradient(90deg,#4fc3f7,#0288d1)}
.llm-row .bar-fill.claude{background:linear-gradient(90deg,#ce93d8,#7b1fa2)}
.llm-row .bar-fill.gemini{background:linear-gradient(90deg,#81c784,#388e3c)}
.llm-row .bar-fill.free{background:linear-gradient(90deg,#ffb74d,#f57c00)}
.llm-row .bar-fill.custom{background:linear-gradient(90deg,#4dd0e1,#0097a7)}
.llm-row .acc-text{width:48px;text-align:right;font-weight:700;font-size:12px;flex-shrink:0;padding-left:6px}
.heatmap-section{margin-bottom:16px}
.heatmap-section h3{font-size:12px;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase}
.heatmap-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:12px}
.heatmap-table th,.heatmap-table td{padding:8px 12px;text-align:center;border-bottom:1px solid var(--border)}
.heatmap-table th{background:var(--surface2);font-weight:600;color:var(--text-muted)}
.heatmap-table td:first-child{text-align:left;font-weight:600}
.cell-high{background:rgba(63,185,80,.12);color:var(--green);font-weight:600}
.cell-mid{background:rgba(210,153,34,.12);color:var(--yellow);font-weight:600}
.cell-low{background:rgba(248,81,73,.12);color:var(--red);font-weight:600}
.samples-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.samples-section h3{font-size:12px;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.samples-table{width:100%;border-collapse:collapse;font-size:11px}
.samples-table th{text-align:left;padding:6px 8px;color:var(--text-muted);font-weight:600;border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase}
.samples-table td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.samples-table tr:hover{background:var(--surface2)}
.badge{display:inline-block;padding:1px 6px;border-radius:6px;font-size:10px;font-weight:600}
.badge.s1{background:rgba(88,166,255,.12);color:var(--accent)}
.badge.s2{background:rgba(188,140,255,.12);color:var(--purple)}
.badge.s3{background:rgba(248,81,73,.12);color:var(--red)}
.badge.high{background:rgba(63,185,80,.12);color:var(--green)}
.badge.medium{background:rgba(210,153,34,.12);color:var(--yellow)}
.badge.low{background:rgba(248,81,73,.12);color:var(--red)}
.match{color:var(--green)}.mismatch{color:var(--red)}
.stepper{display:flex;gap:0;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--text-muted)}
.step .num{width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:10px;background:var(--surface2);flex-shrink:0}
.step.active .num{background:var(--accent);color:#fff}
.step.done .num{background:var(--green);color:#fff}
.step.done{color:var(--green)}
.stepper-arrow{color:var(--border);font-size:14px;padding:0 2px}
.loading-overlay{display:flex;flex-direction:column;align-items:center;padding:40px;gap:12px}
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.info-bar{background:rgba(88,166,255,.06);border:1px solid rgba(88,166,255,.2);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.footer{text-align:center;padding:16px 0;color:var(--text-muted);font-size:11px;border-top:1px solid var(--border);margin-top:16px}
.footer a{color:var(--accent);text-decoration:none}
.error-box{background:rgba(248,81,73,.08);border:1px solid var(--red);border-radius:10px;padding:16px;text-align:center;color:var(--red);margin-bottom:14px;font-size:13px}
.alert-warn{background:rgba(210,153,34,.08);border:1px solid rgba(210,153,34,.3);border-radius:10px;padding:20px;text-align:center;margin-bottom:14px}
.alert-warn .icon{font-size:30px;margin-bottom:8px}
.alert-warn h3{color:var(--yellow);font-size:14px;margin-bottom:6px}
.alert-warn p{color:var(--text-muted);font-size:12px}
@media(max-width:768px){.charts-row{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr 1fr}.provider-card .fields{grid-template-columns:1fr}.llm-row .llm-name{width:100px}}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div><h1 onclick="showPage('dashboard')">🧠 LLM 验证</h1><div class="sub">思路B · 多LLM交叉验证 · <span>v3.0</span></div></div>
    <div class="header-actions" id="headerActions">
      <button class="btn btn-ghost btn-sm" onclick="showPage('settings')" id="settingsBtn" style="display:none">⚙️ 模型配置</button>
      <button class="btn btn-ghost btn-sm" onclick="loadDemo()">📦 演示数据</button>
      <button class="btn btn-primary btn-sm" onclick="document.getElementById('fileInput').click()">📤 上传</button>
      <button class="btn btn-sm" onclick="showAuth()" id="loginBtn">🔑 登录</button>
      <button class="btn btn-ghost btn-sm" onclick="logout()" id="logoutBtn" style="display:none">👤 <span id="userDisplay"></span> · 退出</button>
      <input type="file" id="fileInput" accept=".json" onchange="handleUpload(this.files[0])" style="display:none">
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <h2 id="authTitle">登录</h2>
      <div id="loginForm">
        <div class="form-group"><label>用户名</label><input id="loginUser" placeholder="输入用户名"></div>
        <div class="form-group"><label>密码</label><input id="loginPass" type="password" placeholder="输入密码" onkeydown="if(event.key==='Enter')doLogin()"></div>
        <div class="form-error" id="loginError"></div>
        <div class="form-actions">
          <button class="btn btn-ghost" onclick="toggleAuthMode()">没有账号？注册</button>
          <button class="btn btn-primary" onclick="doLogin()">登录</button>
        </div>
      </div>
      <div id="registerForm" style="display:none">
        <div class="form-group"><label>用户名</label><input id="regUser" placeholder="2-32 个字符"></div>
        <div class="form-group"><label>显示名称（可选）</label><input id="regDisplay" placeholder="如何称呼你"></div>
        <div class="form-group"><label>密码</label><input id="regPass" type="password" placeholder="至少 6 位"></div>
        <div class="form-group"><label>确认密码</label><input id="regPass2" type="password" placeholder="再次输入" onkeydown="if(event.key==='Enter')doRegister()"></div>
        <div class="form-error" id="regError"></div>
        <div class="form-actions">
          <button class="btn btn-ghost" onclick="toggleAuthMode()">已有账号？登录</button>
          <button class="btn btn-green" onclick="doRegister()">注册</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Pages -->
  <div id="settingsPage" style="display:none"></div>
  <div id="dashboardPage">
    <div class="stepper" id="stepper">
      <div class="step active" id="step1"><span class="num">1</span> 上传数据</div><span class="stepper-arrow">▸</span>
      <div class="step" id="step2"><span class="num">2</span> 多LLM验证</div><span class="stepper-arrow">▸</span>
      <div class="step" id="step3"><span class="num">3</span> 结果看板</div>
    </div>
    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()"
         ondragover="this.classList.add('dragover');event.preventDefault()"
         ondragleave="this.classList.remove('dragover')"
         ondrop="event.preventDefault();this.classList.remove('dragover');const f=event.dataTransfer.files[0];if(f)handleUpload(f)">
      <div class="icon">📂</div>
      <div class="title">上传标注数据集</div>
      <div class="hint">拖拽 <code>.json</code> 到这里，或点击选择文件 · 上限 <strong>200MB</strong> / <strong>50,000 条</strong></div>
    </div>
    <div id="loadingArea" class="loading-overlay" style="display:none"><div class="spinner"></div><div style="color:var(--text-muted);font-size:13px" id="loadingText">处理中...</div></div>
    <div id="errorArea" class="error-box" style="display:none"></div>
    <div id="warnArea" style="display:none"></div>
    <div id="infoBar" class="info-bar" style="display:none"></div>
    <div id="providerInfo" class="info-bar" style="display:none"></div>
    <div id="dashboardArea" style="display:none"></div>
  </div>

  <div class="footer">
    <a href="https://github.com/Jared-Linn/llm-validator" target="_blank">llm-validator</a>
    · 滇池学院理工学院 NLP · 思路B
  </div>
</div>

<script>
// ═══ State ═══
let TOKEN = localStorage.getItem('llm_token') || '';
let USER = null;
let currentSessionId = null;
let dashboardData = null;

// ═══ Init ═══
(async function init() {
  if (TOKEN) {
    try {
      const r = await fetch('/api/auth/me', {headers: {'Authorization': `Bearer ${TOKEN}`}});
      if (r.ok) { const d = await r.json(); USER = d.user; updateAuthUI(); }
      else { TOKEN = ''; localStorage.removeItem('llm_token'); }
    } catch(e) { TOKEN = ''; localStorage.removeItem('llm_token'); }
  }
  updateAuthUI();
})();

function authHeaders() { return TOKEN ? {'Authorization': `Bearer ${TOKEN}`} : {}; }

function updateAuthUI() {
  document.getElementById('loginBtn').style.display = USER ? 'none' : '';
  document.getElementById('logoutBtn').style.display = USER ? '' : 'none';
  document.getElementById('settingsBtn').style.display = USER ? '' : 'none';
  document.getElementById('userDisplay').textContent = USER?.username || '';
}

// ═══ Auth ═══
function showAuth() { document.getElementById('authModal').classList.add('show'); document.getElementById('loginUser').focus(); }
function hideAuth() { document.getElementById('authModal').classList.remove('show'); }

let isLogin = true;
function toggleAuthMode() {
  isLogin = !isLogin;
  document.getElementById('authTitle').textContent = isLogin ? '登录' : '注册';
  document.getElementById('loginForm').style.display = isLogin ? '' : 'none';
  document.getElementById('registerForm').style.display = isLogin ? 'none' : '';
}

async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  if (!u || !p) { err.textContent='请填写用户名和密码';err.style.display='';return; }
  try {
    const r = await fetch('/api/auth/login', {method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:`username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`});
    const d = await r.json();
    if (!r.ok) { err.textContent=d.detail||'登录失败';err.style.display='';return; }
    TOKEN = d.token; USER = d.user;
    localStorage.setItem('llm_token', TOKEN);
    updateAuthUI(); hideAuth();
    showPage('dashboard');
  } catch(e) { err.textContent=`网络错误: ${e.message}`;err.style.display=''; }
}

async function doRegister() {
  const u = document.getElementById('regUser').value.trim();
  const d = document.getElementById('regDisplay').value.trim();
  const p = document.getElementById('regPass').value;
  const p2 = document.getElementById('regPass2').value;
  const err = document.getElementById('regError');
  if (p !== p2) { err.textContent='两次密码不一致';err.style.display='';return; }
  try {
    const r = await fetch('/api/auth/register', {method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:`username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}&display_name=${encodeURIComponent(d)}`});
    const dd = await r.json();
    if (!r.ok) { err.textContent=dd.detail||'注册失败';err.style.display='';return; }
    toggleAuthMode(); document.getElementById('loginUser').value=u; document.getElementById('loginPass').value='';
    document.getElementById('loginError').textContent='✅ 注册成功，请登录';document.getElementById('loginError').style.color='var(--green)';document.getElementById('loginError').style.display='';
  } catch(e) { err.textContent=`错误: ${e.message}`;err.style.display=''; }
}

function logout() { TOKEN='';USER=null;localStorage.removeItem('llm_token');updateAuthUI();showPage('dashboard');}

// ═══ Page Routing ═══
function showPage(page) {
  document.getElementById('dashboardPage').style.display = page === 'dashboard' ? '' : 'none';
  document.getElementById('settingsPage').style.display = page === 'settings' ? '' : 'none';
  if (page === 'settings') renderSettings();
}

// ═══ Settings Page ═══
async function renderSettings() {
  const el = document.getElementById('settingsPage');
  if (!USER) { el.innerHTML = '<div class="alert-warn"><div class="icon">🔑</div><h3>请先登录</h3><p>登录后才能配置自己的 LLM API Key</p><button class="btn btn-primary" onclick="showAuth()" style="margin-top:12px">登录 / 注册</button></div>'; el.style.display=''; return; }

  let html = '<div class="settings-panel"><h3>⚙️ LLM 模型配置 <small>配置后系统将使用真实LLM验证标注，未配置则使用免费内置模型</small></h3>';

  try {
    const [provRes, cfgRes] = await Promise.all([
      fetch('/api/providers'),
      fetch('/api/user/configs', {headers: authHeaders()})
    ]);
    const providers = await provRes.json();
    const configsData = await cfgRes.json();
    const configs = configsData.configs || [];
    const configMap = {}; configs.forEach(c => { configMap[c.provider] = c; });

    providers.forEach(p => {
      const cfg = configMap[p.id];
      const hasKey = cfg && cfg.api_key;
      const masked = cfg?.api_key_masked || '';
      const savedModel = cfg?.model || '';
      const savedUrl = cfg?.base_url || '';
      const statusCls = hasKey ? 'configured' : 'missing';
      const statusTxt = hasKey ? `✅ 已配置 (${masked})` : '❌ 未配置';
      const modelOptions = p.models?.length ? p.models.map(m =>
        `<option value="${m}" ${savedModel===m?'selected':''}>${m}</option>`
      ).join('') : '<option value="">自定义模型名</option>';

      html += `<div class="provider-card">
        <div class="head">
          <span class="name">${p.label}</span>
          <span class="status ${statusCls}">${statusTxt}</span>
        </div>
        <div class="fields">
          <div class="full"><input id="key_${p.id}" placeholder="${p.needs_key ? 'API Key (sk-...)' : '无需 API Key'}" value="${cfg?.api_key||''}" type="password"></div>
          <div><label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:2px">模型</label>
            <select id="model_${p.id}">${modelOptions}</select></div>
          <div><label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:2px">接口地址</label>
            <input id="url_${p.id}" placeholder="${p.default_base_url||'默认'}" value="${savedUrl||p.default_base_url||''}"></div>
        </div>
        <div style="margin-top:8px;display:flex;gap:6px">
          <button class="btn btn-green btn-sm" onclick="saveProvider('${p.id}')">💾 保存</button>
          ${hasKey ? `<button class="btn btn-red btn-sm" onclick="deleteProvider('${p.id}')">🗑️ 清除</button>` : ''}
          ${p.docs_url ? `<a href="${p.docs_url}" target="_blank" class="btn btn-ghost btn-sm" style="margin-left:auto">🔗 获取 Key</a>` : ''}
        </div>
      </div>`;
    });

    html += '</div>';
    el.innerHTML = html; el.style.display = '';
  } catch(e) { el.innerHTML = `<div class="error-box">加载失败: ${e.message}</div>`; el.style.display = ''; }
}

async function saveProvider(pid) {
  const key = document.getElementById(`key_${pid}`).value.trim();
  const model = document.getElementById(`model_${pid}`)?.value || '';
  const url = document.getElementById(`url_${pid}`)?.value.trim() || '';
  try {
    const r = await fetch('/api/user/configs', {method:'POST',
      headers:{...authHeaders(),'Content-Type':'application/x-www-form-urlencoded'},
      body:`provider=${pid}&api_key=${encodeURIComponent(key)}&model=${encodeURIComponent(model)}&base_url=${encodeURIComponent(url)}`});
    const d = await r.json();
    if (!r.ok) { alert(d.detail); return; }
    renderSettings();
  } catch(e) { alert(`保存失败: ${e.message}`); }
}

async function deleteProvider(pid) {
  try {
    await fetch(`/api/user/configs/${pid}`, {method:'DELETE', headers:authHeaders()});
    renderSettings();
  } catch(e) { alert(`清除失败: ${e.message}`); }
}

// ═══ Upload ═══
async function handleUpload(file) {
  if (!file) return;
  if (!file.name.endsWith('.json')) { showError('仅支持 .json 文件'); return; }
  if (file.size > 200*1024*1024) { showError(`文件过大 (${(file.size/1024/1024).toFixed(1)}MB)`); return; }
  setStep(1); showLoading('上传数据中...');
  const form = new FormData(); form.append('file', file);
  try {
    const r = await fetch('/api/upload', {method:'POST', body:form, headers:authHeaders()});
    const d = await r.json();
    if (!r.ok) { showError(d.detail||'上传失败'); return; }
    currentSessionId = d.session_id;
    hideLoading();
    showInfo(`📄 ${d.filename} — ${d.total_records} 条，采样 ${d.sampled} 条${d.has_labels ? ' ✅ 含标签' : ' ⚠️ 无标签'}`);
    if (d.has_labels) {
      setStep(1,true); setStep(2,true);
      document.getElementById('infoBar').innerHTML += ` <button class="btn btn-green btn-sm" onclick="startAnalysis('${d.session_id}')">开始验证 →</button>`;
    }
    if (!d.has_labels) showWarn('无标注标签', '数据不含 labels.label 字段，仅展示概览');
  } catch(e) { showError(`网络错误: ${e.message}`); }
}

// ═══ Analysis ═══
async function startAnalysis(sessionId) {
  setStep(2); showLoading('多LLM验证分析中...');
  try {
    const r = await fetch(`/api/analyze/${sessionId}`, {method:'POST', headers:authHeaders()});
    const d = await r.json();
    if (!r.ok) { showError(d.detail||'分析失败'); return; }
    if (d.status === 'no_labels') { hideLoading(); showWarn('无法验证', d.message); return; }
    dashboardData = d; currentSessionId = sessionId;
    hideLoading(); setStep(2,true); setStep(3,true);
    if (d.used_providers) {
      const names = d.used_providers.map(p => p.name).join(' · ');
      document.getElementById('providerInfo').style.display='flex';
      document.getElementById('providerInfo').innerHTML = `🧠 使用模型: ${names} ${USER ? `<button class="btn btn-ghost btn-sm" onclick="showPage('settings')">⚙️ 修改配置</button>` : `<button class="btn btn-ghost btn-sm" onclick="showAuth()">🔑 登录配置自定义模型</button>`}`;
    }
    renderDashboard(d);
  } catch(e) { showError(`分析失败: ${e.message}`); }
}

// ═══ Demo ═══
async function loadDemo() {
  showLoading('加载演示数据...');
  try {
    const r = await fetch('/api/demo', {headers:authHeaders()});
    const d = await r.json();
    if (!r.ok) { showError(d.detail||'加载失败'); return; }
    currentSessionId = d.session_id; dashboardData = d.dashboard;
    hideLoading(); setStep(1,true); setStep(2,true); setStep(3,true);
    showInfo('📦 演示数据已加载 (student-01 采样 200 条)');
    renderDashboard(d.dashboard);
  } catch(e) { showError(`加载失败: ${e.message}`); }
}

// ═══ Dashboard Render ═══
function renderDashboard(d) {
  const area = document.getElementById('dashboardArea'); area.style.display='block';
  const ov = d.overview;
  let html = `<div class="stats-grid">
    <div class="stat-card"><div class="label">已验证样本</div><div class="value blue">${ov.total_samples}</div><div class="sub">分层抽样</div></div>
    <div class="stat-card"><div class="label">参与LLM</div><div class="value purple">${ov.llm_count}</div><div class="sub">${(ov.llm_list||[]).join(' · ')}</div></div>
    <div class="stat-card"><div class="label">Fleiss Kappa</div><div class="value ${ov.fleiss_kappa>=0.6?'green':ov.fleiss_kappa>=0.4?'yellow':'red'}">${(ov.fleiss_kappa*100).toFixed(1)}%</div><div class="sub">多标注者一致率</div></div>
    <div class="stat-card"><div class="label">全一致率</div><div class="value cyan">${(ov.overall_agreement*100).toFixed(1)}%</div><div class="sub">所有LLM相同</div></div>
    <div class="stat-card"><div class="label">多数一致率</div><div class="value green">${(ov.majority_agreement*100).toFixed(1)}%</div><div class="sub">≥半数LLM同意</div></div>
    <div class="stat-card"><div class="label">共识 vs 原始</div><div class="value ${(ov.consensus_vs_gold*100)>=80?'green':'yellow'}">${(ov.consensus_vs_gold*100).toFixed(1)}%</div><div class="sub">共识与原始标注一致率</div></div>
  </div>`;

  let llmBars=''; (d.llm_ranking||[]).forEach(r => {
    const cls = r.llm.includes('DeepSeek')?'deepseek':r.llm.includes('Claude')?'claude':r.llm.includes('Gemini')?'gemini':r.llm.includes('Free')?'free':'custom';
    const w = Math.max((r.accuracy/100)*95, 5);
    llmBars += `<div class="llm-row"><div class="llm-name">${r.llm}</div><div class="bar-track"><div class="bar-fill ${cls}" style="width:${w}%">${r.accuracy.toFixed(1)}%</div></div><div class="acc-text">${r.accuracy.toFixed(1)}%</div></div>`;
  });

  let heatHTML='<table class="heatmap-table"><thead><tr><th></th>';(ov.llm_list||[]).forEach(l=>{heatHTML+=`<th>${l}</th>`});heatHTML+='</tr></thead><tbody>';
  (ov.llm_list||[]).forEach(llmA=>{heatHTML+=`<tr><td>${llmA}</td>`;(ov.llm_list||[]).forEach(llmB=>{const p=(d.pairwise_matrix||{})[llmA]?.[llmB];if(llmA===llmB){heatHTML+=`<td class="cell-high">100%</td>`;return}if(!p){heatHTML+='<td>-</td>';return}const cls=p.ratio>=0.8?'cell-high':p.ratio>=0.6?'cell-mid':'cell-low';heatHTML+=`<td class="${cls}">${(p.ratio*100).toFixed(1)}%</td>`});heatHTML+='</tr>'});
  heatHTML+='</tbody></table>';

  const cd=d.consensus_detail||{}; const consensusList=d.consensus_samples||[]; const tiers=d.agreement_tiers||{};
  const totalTier=tiers.high+tiers.medium+tiers.low+tiers.none;
  let sb=''; consensusList.forEach(s=>{
    const g=s.gold_label||'?',c=s.consensus_label, m=g===c;
    const gl=g.charAt&&g.charAt(0)==='3'?'s3':g.charAt&&g.charAt(0)==='2'?'s2':'s1';
    const cl=c.charAt&&c.charAt(0)==='3'?'s3':c.charAt&&c.charAt(0)==='2'?'s2':'s1';
    const tc=s.agreement_ratio>=0.8?'high':s.agreement_ratio>=0.5?'medium':'low';
    const vs=s.votes?Object.entries(s.votes).map(([k,v])=>k.substring(0,10)+':'+v).join(' '):'';
    sb+=`<tr><td>${s.idx}</td><td><span class="badge ${gl}">${g}</span></td><td><span class="badge ${cl}">${c}</span></td><td class="${m?'match':'mismatch'}">${m?'✓':'✗'}</td><td><span class="badge ${tc}">${(s.agreement_ratio*100).toFixed(0)}%</span></td><td style="font-size:10px;color:var(--text-muted)">${vs}</td></tr>`;
  });

  html+=`<div class="charts-row">
    <div class="chart-card"><h3>📊 LLM vs 原始 — 准确率</h3><div class="chart-container"><canvas id="pc"></canvas></div></div>
    <div class="chart-card"><h3>🎯 一致性分层</h3><div class="chart-container"><canvas id="tc"></canvas></div><div style="display:flex;justify-content:center;gap:10px;margin-top:6px;font-size:10px"><span style="color:var(--green)">高 ${tiers.high}</span><span style="color:var(--yellow)">中 ${tiers.medium}</span><span style="color:var(--red)">低 ${tiers.low+tiers.none}</span></div></div>
  </div>
  <div class="llm-section"><h3>🏆 LLM 准确率排名</h3>${llmBars}</div>
  <div class="heatmap-section"><h3>🔄 两两一致率</h3>${heatHTML}</div>
  <div class="samples-section"><h3><span>📋 样本明细</span><span style="font-size:10px;font-weight:400;color:var(--text-muted)">匹配 <span class="match">${cd.agreed||0}</span> / 不匹配 <span class="mismatch">${(cd.total||0)-(cd.agreed||0)}</span> / 共 ${cd.total||0}${currentSessionId?` <button class="btn btn-ghost btn-sm" onclick="window.open('/api/download/${currentSessionId}','_blank')">⬇️ 下载</button>`:''}</span></h3>
    <table class="samples-table"><thead><tr><th>#</th><th>原始</th><th>共识</th><th>✓</th><th>一致率</th><th>投票</th></tr></thead><tbody>${sb}</tbody></table>
  </div>`;
  area.innerHTML=html;

  setTimeout(()=>{
    const perf=(d.llm_performance||[]);
    const c1=document.getElementById('pc'); if(c1) new Chart(c1,{type:'bar',data:{labels:perf.map(p=>p.name.substring(0,14)),datasets:[{label:'%',data:perf.map(p=>p.accuracy),backgroundColor:perf.map(p=>p.name.includes('DeepSeek')?'#0288d1':p.name.includes('Claude')?'#7b1fa2':p.name.includes('Gemini')?'#388e3c':p.name.includes('Free')?'#f57c00':'#58a6ff'),borderRadius:6,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false},tooltip:{backgroundColor:'#21262d',callbacks:{label:ctx=>`${perf[ctx.dataIndex].correct}/${perf[ctx.dataIndex].total}=${ctx.raw}%`}}},scales:{x:{min:0,max:100,grid:{color:'#21262d'},ticks:{color:'#8b949e'}},y:{grid:{display:false},ticks:{color:'#e6edf3',font:{size:10}}}}}});
    const c2=document.getElementById('tc'); if(c2) new Chart(c2,{type:'doughnut',data:{labels:['高≥80%','中50-80%','低<50%'],datasets:[{data:[tiers.high,tiers.medium,tiers.low+tiers.none],backgroundColor:['#3fb950','#d29922','#f85149'],borderColor:'#0d1117',borderWidth:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#8b949e',padding:8,font:{size:10}}}},cutout:'65%'}});
  },50);
}

// ═══ Utils ═══
function setStep(n,done){for(let i=1;i<=3;i++){const e=document.getElementById('step'+i);e.className='step';if(done&&i<n)e.className='step done';if(i===n)e.className=done?'step done':'step active'}}
function showLoading(t){document.getElementById('loadingArea').style.display='flex';document.getElementById('loadingText').textContent=t||'...';document.getElementById('uploadZone').style.display='none';document.getElementById('dashboardArea').style.display='none';document.getElementById('infoBar').style.display='none';document.getElementById('warnArea').style.display='none';document.getElementById('providerInfo').style.display='none'}
function hideLoading(){document.getElementById('loadingArea').style.display='none';document.getElementById('uploadZone').style.display='block'}
function showError(m){document.getElementById('errorArea').style.display='block';document.getElementById('errorArea').innerHTML=`❌ ${m}`;hideLoading()}
function showInfo(m){document.getElementById('infoBar').style.display='flex';document.getElementById('infoBar').innerHTML=m}
function showWarn(t,d){document.getElementById('warnArea').style.display='block';document.getElementById('warnArea').innerHTML=`<div class="alert-warn"><div class="icon">⚠️</div><h3>${t}</h3><p>${d}</p></div>`}

// Close modal on overlay click
document.getElementById('authModal').addEventListener('click', function(e) { if(e.target===this) hideAuth(); });
</script>
